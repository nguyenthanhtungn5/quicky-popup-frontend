name: CI/CD Pipeline
on:
  push:
    branches:
      - automatisierung
      - main
  pull_request:
    branches:
      - main
      - automatisierung
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14'
      - name: Install dependencies
        run: |
          npm install

      - name: Run tests
        run: |
          npm test  --if-present

      - name: Build project
        run: |
          npm run build --if-present